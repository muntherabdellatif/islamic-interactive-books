<!doctype html>
<!--
  Stage-4 interactive viewer for تحفة الأطفال (Tuhfat al-Atfal).
  Run from the repository root:  python -m http.server
  Then open:                     http://localhost:8000/review/tuhfat-interactive/?page=2
  Data sources (read-only here): ../../data/books/tuhfat-al-atfal/{entities.json,interactive.json,html/*.html}
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحفة الأطفال — المساحة التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../page-style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/book.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/makhraj.css">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body>
<div class="app-shell">
  <header class="top-nav">
    <div class="nav-brand">
      <div>
        <span class="brand-title">تحفة الأطفال والغلمان</span>
        <span class="brand-subtitle">مساحة تعلّم تفاعلية لمتن الجمزوري</span>
      </div>
    </div>

    <div class="nav-pager">
      <button id="prev-page" title="الصفحة السابقة" aria-label="السابقة">‹</button>
      <input id="page-input" type="number" min="1" aria-label="رقم الصفحة">
      <span class="of">/ <span id="page-max"></span></span>
      <button id="next-page" title="الصفحة التالية" aria-label="التالية">›</button>
    </div>

    <div class="nav-tools">
      <button id="toggle-scan" title="عرض صورة الصفحة الأصلية بدل النص">📷 الصورة الأصلية</button>
    </div>
  </header>

  <!-- dir="ltr" here only to pin physical left/right of the two panes (book right, tool left,
       matching Arabic reading order); each pane restores dir="rtl" for its own text. -->
  <main class="split-workspace" dir="ltr">
    <section class="pane pane-book" dir="rtl">
      <div class="book-toolbar">النص مطابق لطبعة المرحلة ١ المعتمدة — اضغط أي بيت أو حكم مظلّل لربطه بالبطاقة المقابلة.</div>
      <div class="book-scroll-area" id="book-pane"></div>
    </section>

    <section class="pane pane-panel" id="panel-pane" dir="rtl">
      <div class="goal-banner">اختر صفحة لعرض الأبيات والأحكام المرتبطة بها.</div>
    </section>
  </main>
</div>

<script type="module" src="js/makhraj-3d.js"></script>
<script src="js/constants.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/sync.js"></script>
<script src="js/audio-view.js"></script>
<script src="js/makhraj-view.js"></script>
<script src="js/card-builders.js"></script>
<script src="js/book-view.js"></script>
<script src="js/panel-view.js"></script>
<script src="js/app.js"></script>
</body>
</html>
