<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{BOOK_TITLE}} - المجلد {{VOLUME_NUMBER}} - صفحة {{PRINTED_PAGE}}</title>
  <!-- خطوط عربية تراثية أصيلة عالية الوضوح -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* CSS Stylesheet for Al-Nashr Heritage Typography */
    :root {
      --primary-color: #1e3a5f;
      --accent-color: #8b5e34;
      --border-color: #d1d5db;
      --bg-page: #fcfbf7;
      --text-main: #0f172a; /* حبر داكن فاحم عالي التباين والوضوح */
      --text-muted: #475569;
      --font-family-body: 'Amiri', 'Scheherazade New', 'Traditional Arabic', serif;
      --base-font-size: 1.35rem; /* تكبير الخط بنسبة متوازنة */
      --line-height: 1.95;       /* ارتفاع سطر مضبوط لمنع تمدد الصفحة */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f3f4f6;
      font-family: var(--font-family-body);
      color: var(--text-main);
      padding: 20px;
      direction: rtl;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .manuscript-page {
      background: var(--bg-page);
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 36px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      position: relative;
      line-height: var(--line-height);
      font-size: var(--base-font-size);
      letter-spacing: 0.01em;
      word-spacing: 0.04em;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .page-header .book-title {
      font-weight: bold;
      color: var(--primary-color);
    }

    .page-body {
      min-height: 550px;
    }

    .chapter-heading {
      color: var(--primary-color);
      font-size: 1.55rem;
      font-weight: bold;
      text-align: center;
      margin: 18px 0;
      padding: 8px 0;
      border-top: 1px dashed var(--border-color);
      border-bottom: 1px dashed var(--border-color);
    }

    .section-heading {
      color: var(--accent-color);
      font-size: 1.35rem;
      font-weight: bold;
      margin: 14px 0 8px;
    }

    .sub-heading {
      color: #1e293b;
      font-size: 1.2rem;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    .book-heading {
      color: var(--primary-color);
      font-size: 1.45rem;
      font-weight: bold;
      text-align: center;
      margin: 18px 0 12px;
    }

    p.book-paragraph {
      text-align: justify;
      text-justify: inter-word;
      margin-bottom: 12px;
      text-indent: 1.4em;
    }

    .isnad-block {
      background: rgba(30, 58, 95, 0.035);
      border-right: 3px solid var(--primary-color);
      padding: 10px 16px;
      margin: 14px 0;
      border-radius: 0 4px 4px 0;
    }

    .quran-text {
      color: #065f46;
      font-weight: bold;
      padding: 0 4px;
    }

    .poem-bayt {
      text-align: center;
      margin: 14px 0;
      font-style: italic;
    }

    .footnote-ref {
      vertical-align: super;
      font-size: 0.8rem;
      color: var(--accent-color);
      text-decoration: none;
      padding: 0 2px;
      font-weight: bold;
    }

    .page-footer {
      margin-top: 24px;
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
    }

    .footnotes-list {
      font-size: 0.95rem;
      color: #475569;
      list-style-position: inside;
      line-height: 1.7;
    }

    .footnotes-list li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <article class="manuscript-page" data-page-seq="{{PAGE_SEQ}}" data-vol="{{VOLUME_NUMBER}}" data-page-printed="{{PRINTED_PAGE}}">
    <!-- ترويسة الصفحة -->
    <header class="page-header">
      <span class="header-section">{{SECTION_TITLE}}</span>
      <span class="book-title">{{BOOK_TITLE}}</span>
      <span class="page-number">جـ {{VOLUME_NUMBER}} / صـ {{PRINTED_PAGE}}</span>
    </header>

    <!-- نص الصفحة -->
    <main class="page-body">
      {{PAGE_CONTENT_HTML}}
    </main>

    <!-- حواشي وتحقيقات الصفحة -->
    <footer class="page-footer">
      <ol class="footnotes-list">
        {{PAGE_FOOTNOTES_HTML}}
      </ol>
    </footer>
  </article>

</body>
</html>
